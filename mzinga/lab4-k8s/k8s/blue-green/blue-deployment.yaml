apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-blue
  namespace: mzinga-lab4
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      slot: blue
  template:
    metadata:
      labels:
        app: webapp
        slot: blue
    spec:
      containers:
        - name: webapp
          image: mzinga-webapp:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_COLOR
              value: "blue"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
